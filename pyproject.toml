[build-system]
requires = ["setuptools>=82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nok-Controller"
version = "0.1.0"
description = "Network Operations Kubernetes Controller"

# Necessary python
requires-python = ">=3.12.10,<3.13"

dependencies = [
    "kubernetes==35.0.0",
    "flask==3.1.3",
    "ping3==5.1.5",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "black==26.1.0",
    "coverage==7.13.4",
    "flake8==7.3.0",
    "flake8-bugbear==25.11.29",
    "isort==7.0.0",
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-flask==1.3.0",
    "pytest-mock==3.15.1",
]

# Playground: install deps only; run scripts from repo root (e.g. python agent.py).
# To install local packages as well, use: packages = { find = {} } and set include below.
[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]

# Note: flake8 doesn't natively support pyproject.toml, use .flake8 file for reference
